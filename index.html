<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юридический ИИ-Ассистент</title>
<!-- Используем unpkg как альтернативу cdn.jsdelivr.net -->
<script src="https://unpkg.com/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>
<style>
  /* Стили — те же, что были (не менял) */
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --border: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header h1 { font-size: 1.25rem; color: var(--accent2); }
  .header .subtitle { font-size: 0.8rem; color: var(--text2); }
  .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 0.875rem;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent2); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .main { flex: 1; display: flex; overflow: hidden; }
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s;
  }
  .sidebar-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 0.5rem; }
  .history-item {
    padding: 0.6rem 0.8rem;
    border-radius: 0.4rem;
    cursor: pointer;
    font-size: 0.85rem;
    margin-bottom: 0.3rem;
    transition: background 0.2s;
    border-left: 3px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--surface2); }
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    max-width: 85%;
    padding: 1rem 1.2rem;
    border-radius: 1rem;
    line-height: 1.6;
    font-size: 0.95rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  .message.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 0.25rem;
  }
  .message.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 0.25rem;
  }
  .message.bot .source {
    font-size: 0.8rem;
    color: var(--text2);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .message.bot .source-tag {
    display: inline-block;
    background: var(--surface2);
    padding: 0.15rem 0.5rem;
    border-radius: 0.25rem;
    font-size: 0.75rem;
    margin-right: 0.3rem;
    margin-bottom: 0.2rem;
    cursor: pointer;
  }
  .message.bot .source-tag:hover { background: var(--border); }
  .priority-badge {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 0.3rem;
  }
  .priority-1 { background: #fbbf24; }
  .priority-2 { background: #f97316; }
  .priority-3 { background: #3b82f6; }
  .priority-4 { background: #22c55e; }
  .priority-5 { background: #a855f7; }
  .input-area {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .input-box {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  .input-box textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-size: 0.95rem;
    resize: none;
    min-height: 48px;
    max-height: 150px;
    font-family: inherit;
    outline: none;
  }
  .input-box textarea:focus { border-color: var(--accent); }
  .input-box .btn { height: 48px; padding: 0 1.2rem; }
  .loading-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border-radius: 0.5rem;
    font-size: 0.85rem;
    color: var(--text2);
    align-self: flex-start;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1rem;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    max-width: 700px;
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; } }
  .modal-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 { font-size: 1.1rem; }
  .modal-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.5rem;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body {
    padding: 1.5rem;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body .field { margin-bottom: 1rem; }
  .modal-body label {
    display: block;
    font-size: 0.85rem;
    color: var(--text2);
    margin-bottom: 0.3rem;
  }
  .modal-body input, .modal-body textarea, .modal-body select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.6rem 0.8rem;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }
  .modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus { border-color: var(--accent); }
  .modal-body textarea { min-height: 100px; resize: vertical; }
  .modal-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .knowledge-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .knowledge-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .knowledge-item:hover { border-color: var(--accent); }
  .knowledge-item .k-title { flex: 1; font-weight: 500; }
  .knowledge-item .k-type {
    font-size: 0.75rem;
    color: var(--text2);
    background: var(--surface2);
    padding: 0.15rem 0.4rem;
    border-radius: 0.25rem;
  }
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 2rem;
    gap: 1.5rem;
  }
  .welcome-screen h2 { font-size: 1.5rem; color: var(--accent2); }
  .welcome-screen p { color: var(--text2); max-width: 500px; }
  .quick-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    cursor: pointer;
    font-size: 0.85rem;
    transition: 0.2s;
  }
  .quick-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }
  .status-bar {
    padding: 0.5rem 1.5rem;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
  }
  .status-bar .model-status { display: flex; align-items: center; gap: 0.4rem; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
  }
  .status-dot.ready { background: var(--success); }
  .status-dot.loading { background: var(--warning); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .mobile-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.25rem;
    cursor: pointer;
  }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
  }
  .sidebar-backdrop.active { display: block; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: block; }
    .message { max-width: 95%; }
  }
  .toast {
    position: fixed;
    right: 1.5rem;
    bottom: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    border-radius: 0.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 2000;
    animation: toastIn 0.3s ease;
    font-size: 0.9rem;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
</style>
</head>
<body>

<header class="header">
  <div>
    <h1>⚖️ Юридический ИИ-Ассистент</h1>
    <div class="subtitle">Семантический поиск с доучиванием</div>
  </div>
  <div class="header-actions">
    <button class="mobile-toggle" id="mobileToggle">☰</button>
    <button class="btn" id="teachBtn">🎓 Обучить</button>
    <button class="btn" id="kbBtn">📚 База знаний</button>
    <button class="btn" id="exportBtn">📤 Экспорт</button>
    <button class="btn" id="importBtn">📥 Импорт</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <button class="btn danger" id="clearBtn">🗑️ Очистить</button>
  </div>
</header>

<div class="main">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">📜 История запросов</div>
    <div class="sidebar-content" id="historyList"></div>
  </aside>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome-screen" id="welcome">
        <h2>Добро пожаловать!</h2>
        <p>Задайте юридический вопрос – ассистент найдёт ответ в законах и вашей базе знаний.</p>
        <div class="quick-buttons">
          <button class="quick-btn" data-question="Как подать на алименты?">Как подать на алименты?</button>
          <button class="quick-btn" data-question="Права арендатора жилья">Права арендатора</button>
          <button class="quick-btn" data-question="Срок исковой давности">Срок исковой давности</button>
          <button class="quick-btn" data-question="Раздел имущества при разводе">Раздел имущества</button>
          <button class="quick-btn" data-question="Трудовой договор, обязательные условия">Трудовой договор</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="Введите ваш юридический вопрос..."></textarea>
        <button class="btn primary" id="sendBtn" disabled>➤</button>
      </div>
    </div>
    <div class="status-bar">
      <div class="model-status">
        <span class="status-dot" id="modelDot"></span>
        <span id="modelText">Загрузка модели...</span>
      </div>
      <div>Блоков: <strong id="kbCount">0</strong></div>
    </div>
  </div>
</div>

<!-- Модалки (без изменений) -->
<div class="modal-overlay" id="teachModal">
  <div class="modal">
    <div class="modal-header">
      <h2>🎓 Доучить ассистента</h2>
      <button class="modal-close" data-close="teachModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Вопрос / ключевые слова</label>
        <input type="text" id="teachQuestion" placeholder="Например: Как оформить дарственную?">
      </div>
      <div class="field">
        <label>Ответ / содержание блока</label>
        <textarea id="teachAnswer" placeholder="Подробный ответ..."></textarea>
      </div>
      <div class="field">
        <label>Тип источника</label>
        <select id="teachType">
          <option value="knowledge">База знаний</option>
          <option value="law">Норма права</option>
          <option value="practice">Судебная практика</option>
        </select>
      </div>
      <div class="field">
        <label>Приоритет (1=высший)</label>
        <select id="teachPriority">
          <option value="1">1 — Конституция</option>
          <option value="2">2 — Международные договоры</option>
          <option value="3" selected>3 — Федеральные законы</option>
          <option value="4">4 — Кодексы</option>
          <option value="5">5 — Судебная практика</option>
        </select>
      </div>
      <div class="field">
        <label>Быстрый ответ (кратко)</label>
        <input type="text" id="teachQuick" placeholder="Краткий ответ в 1-2 предложения">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close="teachModal">Отмена</button>
      <button class="btn primary" id="saveTeachBtn">💾 Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="knowledgeModal">
  <div class="modal">
    <div class="modal-header">
      <h2>📚 База знаний</h2>
      <button class="modal-close" data-close="knowledgeModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <input type="text" id="kbSearch" placeholder="🔍 Поиск по базе...">
      </div>
      <div class="knowledge-list" id="knowledgeList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close="knowledgeModal">Закрыть</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">Детали</h2>
      <button class="modal-close" data-close="detailModal">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn danger" id="detailDelete">🗑️ Удалить</button>
      <button class="btn" data-close="detailModal">Закрыть</button>
    </div>
  </div>
</div>

// ============ ГЛОБАЛЬНОЕ СОСТОЯНИЕ ============
let KNOWLEDGE_BASE = [];
let embeddings = [];
let embedder = null;
let chatHistory = [];
let currentDetailId = null;
let isProcessing = false;

// ============ ХРАНЕНИЕ ============
function loadKnowledge() {
  try {
    const stored = localStorage.getItem('ya_knowledge_base');
    const custom = stored ? JSON.parse(stored) : [];
    KNOWLEDGE_BASE = [...DEFAULT_KNOWLEDGE, ...custom];
  } catch (e) {
    KNOWLEDGE_BASE = [...DEFAULT_KNOWLEDGE];
  }
}

function saveCustomKnowledge() {
  try {
    const custom = KNOWLEDGE_BASE.filter(k => !k.id.startsWith('kz_'));
    localStorage.setItem('ya_knowledge_base', JSON.stringify(custom));
    updateKbCount();
  } catch (e) {}
}

function loadChatHistory() {
  try {
    const stored = localStorage.getItem('ya_chat_history');
    if (stored) chatHistory = JSON.parse(stored);
  } catch (e) { chatHistory = []; }
}

function saveChatHistory() {
  try {
    localStorage.setItem('ya_chat_history', JSON.stringify(chatHistory.slice(0, 50)));
  } catch (e) {}
}

function updateKbCount() {
  document.getElementById('kbCount').textContent = KNOWLEDGE_BASE.length;
}

// ============ ЗАГРУЗКА ИЗ ПАПКИ ============
async function loadExternalBlocks() {
  try {
    const res = await fetch('blocks/list.json');
    if (!res.ok) {
      console.log('blocks/list.json не найден — внешние блоки пропущены');
      return;
    }
    const fileList = await res.json();
    if (!Array.isArray(fileList)) return;
    let loaded = 0;
    for (const fileName of fileList) {
      try {
        const resp = await fetch(`blocks/${fileName}`);
        if (!resp.ok) continue;
        const data = await resp.json();
        const blocks = Array.isArray(data) ? data : [data];
        for (const block of blocks) {
          if (!block.id || !block.title || !block.content) continue;
          if (!KNOWLEDGE_BASE.find(k => k.id === block.id)) {
            block.priority = block.priority || 4;
            block.type = block.type || 'knowledge';
            block.source = block.source || `Внешний (${fileName})`;
            block.keywords = block.keywords || [];
            KNOWLEDGE_BASE.push(block);
            loaded++;
          }
        }
      } catch (err) {}
    }
    console.log(`Загружено ${loaded} внешних блоков`);
    updateKbCount();
  } catch (e) {
    console.warn('Ошибка загрузки внешних блоков:', e);
  }
}

// ============ ИНДЕКСАЦИЯ ============
async function rebuildIndex() {
  if (!embedder) return;
  embeddings = [];
  for (let i = 0; i < KNOWLEDGE_BASE.length; i++) {
    const item = KNOWLEDGE_BASE[i];
    const text = `${item.title} ${item.content} ${item.keywords.join(' ')}`;
    try {
      const result = await embedder(text, { pooling: 'mean', normalize: true });
      embeddings.push({ id: item.id, vector: Array.from(result.data) });
    } catch (e) {
      embeddings.push({ id: item.id, vector: null });
    }
    if (i % 3 === 0) {
      document.getElementById('modelText').textContent = `Индексация... ${i+1}/${KNOWLEDGE_BASE.length}`;
      await new Promise(r => setTimeout(r, 10));
    }
  }
  setModelStatus('ready');
}

function cosineSimilarity(a, b) {
  if (!a || !b || a.length !== b.length) return 0;
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  const denom = Math.sqrt(na) * Math.sqrt(nb);
  return denom === 0 ? 0 : dot / denom;
}

// ============ ПОИСК ============
async function search(query) {
  const results = [];
  const qWords = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);

  if (embedder && embeddings.length > 0) {
    try {
      const qVec = await embedder(query, { pooling: 'mean', normalize: true });
      const qArr = Array.from(qVec.data);
      for (let i = 0; i < embeddings.length; i++) {
        if (embeddings[i].vector) {
          const score = cosineSimilarity(qArr, embeddings[i].vector);
          results.push({ item: KNOWLEDGE_BASE[i], score, match: 'semantic' });
        }
      }
    } catch (e) {}
  }

  for (let i = 0; i < KNOWLEDGE_BASE.length; i++) {
    const item = KNOWLEDGE_BASE[i];
    const text = `${item.title} ${item.content} ${item.keywords.join(' ')}`.toLowerCase();
    let kwScore = 0;
    qWords.forEach(w => {
      if (text.includes(w)) kwScore += 0.3;
      item.keywords.forEach(k => {
        if (k.toLowerCase().includes(w) || w.includes(k.toLowerCase())) kwScore += 0.5;
      });
    });
    const existing = results.find(r => r.item.id === item.id);
    if (existing) existing.score += kwScore;
    else if (kwScore > 0) results.push({ item, score: kwScore, match: 'keyword' });
  }

  results.sort((a, b) => {
    const pDiff = a.item.priority - b.item.priority;
    if (pDiff !== 0) return pDiff;
    return b.score - a.score;
  });
  return results.filter(r => r.score > 0.15).slice(0, 7);
}

// ============ ОТВЕТ ============
function buildAnswer(results) {
  if (!results.length) {
    return { text: 'Ничего не найдено. Попробуйте переформулировать вопрос или обучите ассистента.', sources: [] };
  }
  const best = results.find(r => r.item.quickReply && r.score > 0.4);
  if (best) {
    return { text: `${best.item.quickReply}\n\n${best.item.content}`, sources: [best.item] };
  }
  let text = '';
  const sources = [];
  results.slice(0, 5).forEach((r, idx) => {
    const item = r.item;
    if (idx === 0) text = item.content;
    else text += `\n\nТакже: ${item.title} — ${item.content.substring(0, 200)}...`;
    if (!sources.find(s => s.id === item.id)) sources.push(item);
  });
  return { text, sources };
}

// ============ ЧАТ ============
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isProcessing) return;
  isProcessing = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  addMessage(text, 'user');
  addToHistory(text);
  const loadId = addLoading();

  try {
    const results = await search(text);
    removeLoading(loadId);
    const answer = buildAnswer(results);
    addMessage(answer.text, 'bot', answer.sources);
  } catch (e) {
    removeLoading(loadId);
    addMessage('Ошибка: ' + e.message, 'bot', []);
  }
  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  const ta = e.target;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 150) + 'px';
}

function addMessage(text, sender, sources) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  const formatted = escapeHtml(text).replace(/\n/g, '<br>');
  div.innerHTML = formatted;
  if (sender === 'bot' && sources && sources.length) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'source';
    srcDiv.innerHTML = '<strong>Источники:</strong><br>';
    sources.forEach(s => {
      const badge = document.createElement('span');
      badge.className = 'source-tag';
      badge.innerHTML = `<span class="priority-badge priority-${s.priority}"></span>${escapeHtml(s.source)} ${escapeHtml(s.article || '')}`;
      badge.onclick = () => showDetail(s.id);
      srcDiv.appendChild(badge);
    });
    div.appendChild(srcDiv);
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addLoading() {
  const container = document.getElementById('messages');
  const id = 'load_' + Date.now();
  const div = document.createElement('div');
  div.id = id;
  div.className = 'loading-indicator';
  div.innerHTML = '<div class="spinner"></div> Анализирую...';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ============ ИСТОРИЯ ============
function addToHistory(text) {
  chatHistory.unshift({ text, time: Date.now() });
  if (chatHistory.length > 50) chatHistory.pop();
  saveChatHistory();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!chatHistory.length) {
    list.innerHTML = '<div class="empty-state">История пуста</div>';
    return;
  }
  list.innerHTML = chatHistory.map((h, i) =>
    `<div class="history-item" data-idx="${i}">${escapeHtml(h.text)}</div>`
  ).join('');
  list.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => sendQuick(chatHistory[el.dataset.idx].text));
  });
}

function clearChat() {
  document.getElementById('messages').innerHTML = `
    <div class="welcome-screen" id="welcome">
      <h2>Добро пожаловать!</h2>
      <p>Задайте юридический вопрос – ассистент найдёт ответ в законах и вашей базе знаний.</p>
      <div class="quick-buttons">
        ${['Как подать на алименты?','Права арендатора жилья','Срок исковой давности','Раздел имущества при разводе','Трудовой договор, обязательные условия']
          .map(q => `<button class="quick-btn" data-question="${q}">${q}</button>`).join('')}
      </div>
    </div>`;
  chatHistory = [];
  saveChatHistory();
  renderHistory();
  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => sendQuick(btn.dataset.question));
  });
}

  document.getElementById('teachQuestion').value = '';
  document.getElementById('teachAnswer').value = '';
  document.getElementById('teachQuick').value = '';
  openModal('teachModal');
}

async function saveTeach() {
  const q = document.getElementById('teachQuestion').value.trim();
  const a = document.getElementById('teachAnswer').value.trim();
  const quick = document.getElementById('teachQuick').value.trim();
  const type = document.getElementById('teachType').value;
  const priority = parseInt(document.getElementById('teachPriority').value);
  if (!q || !a) { showToast('Заполните вопрос и ответ'); return; }
  const newBlock = {
    id: 'custom_' + Date.now(),
    title: q,
    content: a,
    keywords: q.toLowerCase().split(/\s+/).filter(w => w.length > 2),
    type,
    source: 'Пользователь',
    article: '',
    priority,
    quickReply: quick || a.substring(0, 200)
  };
  KNOWLEDGE_BASE.push(newBlock);
  saveCustomKnowledge();
  await rebuildIndex();
  closeModal('teachModal');
  showToast('Блок сохранён!');
}

function openKnowledgeModal() {
  renderKnowledgeList();
  openModal('knowledgeModal');
}

function renderKnowledgeList(filter = '') {
  const list = document.getElementById('knowledgeList');
  const f = filter.toLowerCase();
  const items = KNOWLEDGE_BASE.filter(k =>
    k.title.toLowerCase().includes(f) ||
    k.content.toLowerCase().includes(f) ||
    k.keywords.some(kw => kw.toLowerCase().includes(f))
  );
  list.innerHTML = items.map(k =>
    `<div class="knowledge-item" data-kid="${k.id}">
      <span class="priority-badge priority-${k.priority}"></span>
      <span class="k-title">${escapeHtml(k.title)}</span>
      <span class="k-type">${escapeHtml(k.source)}</span>
    </div>`
  ).join('');
  list.querySelectorAll('.knowledge-item').forEach(el => {
    el.addEventListener('click', () => showDetail(el.dataset.kid));
  });
}

function filterKnowledge() {
  const val = document.getElementById('kbSearch').value;
  renderKnowledgeList(val);
}

function showDetail(id) {
  const item = KNOWLEDGE_BASE.find(k => k.id === id);
  if (!item) return;
  currentDetailId = id;
  document.getElementById('detailTitle').textContent = item.title;
  const isDefault = id.startsWith('kz_');
  document.getElementById('detailDelete').style.display = isDefault ? 'none' : 'inline-flex';
  document.getElementById('detailBody').innerHTML = `
    <p><strong>Источник:</strong> ${escapeHtml(item.source)} ${escapeHtml(item.article || '')}</p>
    <p><strong>Тип:</strong> ${item.type === 'law' ? 'Норма права' : (item.type === 'practice' ? 'Судебная практика' : 'База знаний')}</p>
    <p><strong>Приоритет:</strong> ${item.priority}</p>
    <p><strong>Содержание:</strong></p>
    <p>${escapeHtml(item.content).replace(/\n/g, '<br>')}</p>
    ${item.quickReply ? `<p><strong>Быстрый ответ:</strong> ${escapeHtml(item.quickReply)}</p>` : ''}
    <p><strong>Ключевые слова:</strong> ${item.keywords.join(', ')}</p>
  `;
  openModal('detailModal');
}

async function deleteCurrentBlock() {
  if (!currentDetailId) return;
  KNOWLEDGE_BASE = KNOWLEDGE_BASE.filter(k => k.id !== currentDetailId);
  saveCustomKnowledge();
  await rebuildIndex();
  currentDetailId = null;
  closeModal('detailModal');
  if (document.getElementById('knowledgeModal').classList.contains('active')) {
    renderKnowledgeList(document.getElementById('kbSearch').value);
  }
  showToast('Блок удалён');
}

// ============ ЭКСПОРТ / ИМПОРТ ============
function exportKnowledge() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    customBlocks: KNOWLEDGE_BASE.filter(k => !k.id.startsWith('kz_'))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `legal_assistant_knowledge_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Экспортировано');
}

async function importKnowledge(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.customBlocks && Array.isArray(data.customBlocks)) {
        let added = 0;
        const existing = KNOWLEDGE_BASE.filter(k => !k.id.startsWith('kz_'));
        data.customBlocks.forEach(b => {
          if (!b.title || !b.content) return;
          if (!existing.find(k => k.id === b.id)) {
            b.id = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
            existing.push(b);
            added++;
          }
        });
        KNOWLEDGE_BASE = [...DEFAULT_KNOWLEDGE, ...existing];
        saveCustomKnowledge();
        await rebuildIndex();
        showToast(`Импортировано ${added} блоков`);
      }
    } catch (err) {
      showToast('Ошибка импорта: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ============ УТИЛИТЫ ============
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('active');
}

function setModelStatus(status) {
  const dot = document.getElementById('modelDot');
  const text = document.getElementById('modelText');
  dot.className = 'status-dot ' + status;
  if (status === 'loading') text.textContent = 'Загрузка модели...';
  else if (status === 'ready') text.textContent = 'Модель готова (all-MiniLM-L6-v2)';
  else if (status === 'error') text.textContent = 'Модель недоступна';
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
async function init() {
  loadKnowledge();
  await loadExternalBlocks();
  loadChatHistory();
  updateKbCount();
  renderHistory();
  setModelStatus('loading');

  document.getElementById('mobileToggle').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', toggleSidebar);
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('userInput').addEventListener('keydown', handleKey);
  document.getElementById('teachBtn').addEventListener('click', openTeachModal);
  document.getElementById('kbBtn').addEventListener('click', openKnowledgeModal);
  document.getElementById('exportBtn').addEventListener('click', exportKnowledge);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (e) => {
    importKnowledge(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('clearBtn').addEventListener('click', clearChat);
  document.getElementById('saveTeachBtn').addEventListener('click', saveTeach);

  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', () => closeModal(el.dataset.close));
  });
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target === el) closeModal(el.id);
    });
  });

  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => sendQuick(btn.dataset.question));
  });

  document.getElementById('detailDelete').addEventListener('click', deleteCurrentBlock);
  document.getElementById('kbSearch').addEventListener('input', filterKnowledge);

  try {
    const { pipeline } = window.transformers;
    embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
      quantized: true,
      use_fp16: false,
      cache_dir: null,
      revision: 'main'
    });
    setModelStatus('ready');
    await rebuildIndex();
    document.getElementById('sendBtn').disabled = false;
  } catch (e) {
    console.error('Model init error:', e);
    setModelStatus('error');
    document.getElementById('sendBtn').disabled = false;
  }
}

init();
</script>
